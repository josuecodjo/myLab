---
- name: Add the cert-manager Helm repo
  kubernetes.core.helm_repository:
    name: cert-manager
    repo_url: "https://charts.jetstack.io"
    force_update: true

- name: Deploy cert-manager using Helm
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: cert-manager/cert-manager
    chart_version: "{{ v_certmanager_chart_version }}"
    release_namespace: cert-manager
    create_namespace: true
    state: present
    values:
      crds:
        enabled: true

- name: Wait for certmanager to be ready
  command: kubectl rollout status deployment/cert-manager -n cert-manager
  register: rollout_status
  retries: 30
  delay: 10
  changed_when: false

- name: Créer le dossier acme pour les fichiers de configuration
  file:
    path: "{{ v_global_install_path }}/acme/{{ acme_mode }}"
    state: directory

- name: Copie des fichiers pour l'ACME
  template:
    src: "acme/{{ acme_mode }}/global/{{ item }}.j2"
    dest: "{{ v_global_install_path }}/acme/{{ acme_mode }}/{{ item }}"
  loop:
    - issuer.yaml
    - kustomization.yaml

- name: Appliquer la configuration ACME sur K3S
  command: kubectl apply -k {{ v_global_install_path }}/acme/{{ acme_mode }}

- name: Wait for the lab root CA to be issued
  command: >
    kubectl wait --for=condition=Ready certificate/homelab-ca
    -n cert-manager --timeout=300s
  changed_when: false

- name: Wait for Cluster issuer to be ready
  command: kubectl wait --for=condition=Ready clusterissuers/local-cluster-issuer --timeout=300s
  changed_when: false

- name: Export the lab root CA on the node
  shell: >
    kubectl get secret homelab-ca-tls -n cert-manager
    -o jsonpath='{.data.tls\.crt}' | base64 -d
    > {{ v_global_install_path }}/acme/homelab-ca.crt
  changed_when: false

- name: Fetch the lab root CA to the control node
  fetch:
    src: "{{ v_global_install_path }}/acme/homelab-ca.crt"
    dest: "{{ playbook_dir }}/homelab-ca.crt"
    flat: true

- name: Show how to trust the lab root CA
  debug:
    msg:
      - "Root CA written to {{ playbook_dir }}/homelab-ca.crt on this machine."
      - "macOS:  sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain homelab-ca.crt"
      - "Linux:  sudo cp homelab-ca.crt /usr/local/share/ca-certificates/ && sudo update-ca-certificates"
      - "Firefox uses its own store: Settings -> Privacy & Security -> Certificates -> View Certificates -> Authorities -> Import"

