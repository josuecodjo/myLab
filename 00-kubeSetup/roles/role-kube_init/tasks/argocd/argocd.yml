---
- name: Add the Argo CD Helm repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "https://argoproj.github.io/argo-helm"
    force_update: true

- name: Deploy Argo using Helm
  kubernetes.core.helm:
    name: argo-cd
    chart_ref: argo/argo-cd
    chart_version: "{{ v_argocd_chart_version | default(omit) }}"
    release_namespace: argocd
    create_namespace: true
    state: present
    values:
      global:
        domain: "{{ argocd_hostname }}.{{ global_dns_name }}"
      configs:
        secret:
          argocdServerAdminPassword: "$2y$10$6JOwwFWeY6gMvv4ARt6qD.Qq74hK08xzrsEH2aIrrX9WFn9fS1TQC"
        params:
          server.insecure: true
      # Expose each component's Prometheus metrics Service.
      #
      # Only `metrics.enabled`, NOT `metrics.serviceMonitor.enabled`. The former
      # creates a Service and needs no CRD. The latter creates a ServiceMonitor,
      # and the chart gates that on the monitoring.coreos.com/v1 CRD existing -
      # which it does not here, because this task installs Argo CD and Argo CD
      # only later installs kube-prometheus-stack. It would render nothing and
      # fail silently. The ServiceMonitors ship from argocd-apps instead, in
      # declarative/apps/monitoring-extras (sync wave 2).
      controller:
        metrics:
          enabled: true
      repoServer:
        metrics:
          enabled: true
      applicationSet:
        metrics:
          enabled: true
      notifications:
        metrics:
          enabled: true
      server:
        metrics:
          enabled: true
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: local-cluster-issuer
            cert-manager.io/propagation-timeout: "30s"
            cert-manager.io/polling-interval: "5s"
            # kubernetes.io/ingress.class: traefik
          hosts:
            - "{{ argocd_hostname }}.{{ global_dns_name }}"
          extraTls:
            - hosts:
                - "{{ argocd_hostname }}.{{ global_dns_name }}"
              secretName: "{{ argocd_hostname }}.{{ global_dns_name }}"

- name: Wait for ArgoCD Deployment to appear
  command: >
    kubectl get deployment argo-cd-argocd-server -n argocd --ignore-not-found
  register: deployment_result
  changed_when: false
  failed_when: false
  until: deployment_result.stdout != ""
  retries: 30
  delay: 20

- name: Wait for ArgoCD to be ready
  command: kubectl rollout status deployment/argo-cd-argocd-server -n argocd
  register: rollout_status
  retries: 30
  delay: 10
  changed_when: false

- name: Créer le dossier argocd pour les fichiers de configuration
  file:
    path: "{{ v_global_install_path }}/argocd"
    state: directory

- name: Copy the tools AppProject
  copy:
    src: "argocd/tools-project.yml"
    dest: "{{ v_global_install_path }}/argocd/tools-project.yml"

- name: Register this cluster (the hub) so the ApplicationSet can select it
  copy:
    src: "argocd/cluster-hub.yaml"
    dest: "{{ v_global_install_path }}/argocd/cluster-hub.yaml"

- name: Render the base-apps ApplicationSet
  # One ApplicationSet per hub, not one Application per cluster: a cluster gets
  # the catalog because its registration Secret carries the managed label. With
  # only the hub registered this yields exactly one root app, so the
  # single-cluster path is unchanged.
  template:
    src: "argocd/base-apps-appset.yml.j2"
    dest: "{{ v_global_install_path }}/argocd/base-apps-appset.yml"

- name: Apply the Argo CD bootstrap manifests
  command: kubectl apply -f {{ v_global_install_path }}/argocd

- name: Wait for the hub's root Application to be generated
  command: kubectl get application base-apps-prod -n argocd
  register: _hub_root
  until: _hub_root.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Fail loudly if the implicit in-cluster entry also matched
  # The label selector is expected to exclude Argo CD's implicit "in-cluster"
  # entry, since it has no Secret and therefore no labels. If that assumption is
  # wrong we get a second root app whose children collide with the hub's, so
  # check rather than hope. Fix: set cluster.inClusterEnabled="false" in
  # argocd-cmd-params-cm, which is safe because the hub is registered explicitly.
  command: kubectl get application base-apps-in-cluster -n argocd --ignore-not-found
  register: _stray_root
  changed_when: false
  failed_when: _stray_root.stdout | length > 0
