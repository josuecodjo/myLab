---
# Global configs
global_dns_name: prod.lab
# global_dns_name: softimiz-cloud.com
# Acme mode - must match a directory under
# roles/role-kube_init/templates/acme/ (LOCAL, AWS, Azure). Case-sensitive.
acme_mode: LOCAL
# acme_mode: AWS

# AWX Config
awx_hostname: awx
admin_password: mySuperPass
postgres_storage: 8Gi
web_replicas: 1
task_replicas: 1
postgres_password: awxpostgrespass
awx_projects_storage: 2Gi

hosted_zone_id: changeme
aws_access_key_id: changeme
aws_secret_access_key: changeme

# ArgoCD
argocd_hostname: argocd

# Which base-apps overlay the root app-of-apps should layer on values.yaml.
# "" = catalog defaults only. Options: dev, qa, prod.
# SUPERSEDED: per-cluster values files are now chosen by the base-apps
# ApplicationSet from each cluster's registration name (values-<cluster>.yaml).
# Only the superseded bootstrap.yml.j2 still reads this.
argocd_env: "prod"
